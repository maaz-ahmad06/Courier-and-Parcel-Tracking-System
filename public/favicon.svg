<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="50%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
    <linearGradient id="boxTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fed7aa"/>
    </linearGradient>
    <linearGradient id="boxLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffedd5"/>
      <stop offset="100%" stop-color="#fdba74"/>
    </linearGradient>
    <linearGradient id="boxRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#f97316" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background Rounded Shield / Icon Squircle -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="#ffedd5" stroke-width="1.5" stroke-opacity="0.4" filter="url(#glow)"/>

  <!-- Speed / Radar Accent Dots & Lines -->
  <path d="M12 16L20 16" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.6"/>
  <circle cx="24" cy="16" r="1.5" fill="#ffffff" fill-opacity="0.8"/>

  <!-- 3D Isometric Logistics Package -->
  <!-- Top Face -->
  <path d="M32 17L49 26L32 35L15 26L32 17Z" fill="url(#boxTop)" stroke="#ffffff" stroke-width="1" stroke-linejoin="round"/>

  <!-- Top Center Seam -->
  <path d="M32 17L32 35" stroke="#ea580c" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.4"/>

  <!-- Left Face -->
  <path d="M15 26L32 35V49L15 40V26Z" fill="url(#boxLeft)"/>

  <!-- Right Face -->
  <path d="M32 35L49 26V40L32 49V35Z" fill="url(#boxRight)"/>

  <!-- Outer Box Outlines -->
  <path d="M32 17L49 26V40L32 49L15 40V26L32 17Z" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M32 35V49" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>

  <!-- Live GPS Tracking Radar Pulse Center -->
  <circle cx="32" cy="35" r="3.5" fill="#ffffff" stroke="#ea580c" stroke-width="1.5"/>
  <circle cx="32" cy="35" r="1.5" fill="#ea580c"/>
</svg>